  </g>
  <g stroke="#000000" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="1.5" x2="16" y2="7"/>
    <line x1="16" y1="25" x2="16" y2="30.5"/>
    <line x1="1.5" y1="16" x2="7" y2="16"/>
    <line x1="25" y1="16" x2="30.5" y2="16"/>
  </g>
  <circle cx="16" cy="16" r="1.75" fill="#000000"/>
</svg>

